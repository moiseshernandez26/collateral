<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duel — turn-based arcade over WebMCP</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>

<div id="picker" class="picker">
  <div class="picker-card">
    <h2>WebMCP detected</h2>
    <p>
      This browser can register tools for an agent to call, but that alone
      doesn't mean one is connected — you might not have an agent app or an
      MCP inspector attached right now. How do you want to play?
    </p>
    <div class="picker-choices">
      <button id="pickAgent" class="agent">Play vs agent</button>
      <button id="pickSolo" class="solo">Play solo</button>
    </div>
  </div>
</div>

<div class="bar">
  <h1>Duel</h1>
  <span id="pill" class="pill off">checking…</span>
  <span class="spacer"></span>
  <div class="score" id="scoreBox"></div>
</div>

<div class="wrap">
  <section class="arena">
    <div class="tabs">
      <button id="tabMs" class="on">Minesweeper</button>
      <button id="tabC4">Connect 4</button>
    </div>
    <div id="turn" class="turn h"><span class="who"></span><span class="hint" id="turnHint"></span></div>
    <div class="roundline"><span id="rlLeft"></span><span id="rlRight"></span></div>
    <div id="msGrid"></div>
    <div id="c4Grid" style="display:none"></div>
    <div class="acts" id="acts"></div>
  </section>

  <aside class="rail">
    <section class="sec"><h2><span>Rules</span><span id="gameTag"></span></h2><div id="rules"></div></section>
    <section class="sec" id="logSec">
      <h2><span>Agent calls</span><span id="evCount">0</span></h2>
      <div id="log"><p class="blank">No calls yet.</p></div>
    </section>
  </aside>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
